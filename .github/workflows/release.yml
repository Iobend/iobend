name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Markdown formatting (Prettier)
        run: npx prettier --check "**/*.md"

      - name: Check Broken Links (markdown-link-check)
        run: |
          find . -name "*.md" -not -path "*/node_modules/*" -not -path "*/.git/*" -print0 | xargs -0 -n 1 npx markdown-link-check --quiet

  prepare-release:
    name: Prepare GitHub Release
    needs: validate-docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Release Notes
        id: generate_notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
